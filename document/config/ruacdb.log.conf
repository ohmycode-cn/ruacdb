# ============================================
# RuacDB Log System Configuration
# ============================================

# --- Terminal ANSI Color Settings ---

# ANSI escape sequence mode
# - "true" : use classic \033 (better compatibility with older terminals)
# - "false": use modern \x1b
# Support Value: true, false
# Default: true
ENABLE_TERM_COMPATIBLE_MODE="true";

# Terminal highlight mode (bright colors)
# - "true" : enable ANSI high-intensity color output
# - "false": use standard color intensity
# Support Value: true, false
# Default: false
ENABLE_TERM_HIGHLIGHT_MODE="false";

# Terminal bold font mode
# - "true" : use bold (bright) font weight for log text
# - "false": use normal font weight
# Support Value: true, false
# Default: false
ENABLE_TERM_BOLD_FONT_MODE="false";

# --- Output Format Style ---

# Log format style for terminal output
# - "text": plain text format with delimiters and tokens
# - "json" : JSON structured format
# - "xml"  : XML structured format
# Support Value: text, json, xml
# Default: text
LOG_TERM_FORMAT_STYLE="text";

# Log format style for file output
# Support Value: text, json, xml
# Default: text
LOG_FILE_FORMAT_STYLE="text";

# --- Output Destination ---

# Terminal output mode
# - "console": write to standard output (stdout)
# Support Value: console
# Default: console
LOG_TERM_OUTPUT_MODE="console";

# File output mode
# - "console": write to standard output (same as terminal, for debug)
# - "file"   : write to log file specified by LOG_WRITE_FILE_PATH/NAME
# Support Value: console, file
# Default: console
LOG_FILE_OUTPUT_MODE="file";

# --- File Output Settings (effective when LOG_FILE_OUTPUT_MODE="file") ---

# Directory path for log files (must exist, must be writable)
# Default: /var/log/ruacdb
LOG_WRITE_FILE_PATH="/home/repox/Engdev/ruacdb/tmp";

# Log file name
# Default: ruacdb.default.log
LOG_WRITE_FILE_NAME="ruacdb.default.log";

# Maximum log file size (reserved, not yet enforced)
# Default: 128MB
LOG_FILE_SIZE_LIMIT="128MB";

# --- Log Level Filters ---

# Minimum log level for terminal output
# Messages below this level are not printed to terminal
# Support Value: debug, info, warning, error, fatal
# Default: debug
LOG_TERM_LEVEL_FILTER="debug";

# Minimum log level for file output
# Messages below this level are not written to file
# Support Value: debug, info, warning, error, fatal
# Default: debug
LOG_FILE_LEVEL_FILTER="debug";

# Global minimum log level filter
# Messages below this level are discarded before any output
# Must be <= both terminal and file level filters to be effective
# Support Value: debug, info, warning, error, fatal
# Default: debug
LOG_MINI_LEVEL_FILTER="debug";
